name: Pruebas y despliegue en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # El sitio se publica en https://<usuario>.github.io/<repositorio>/
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # El despliegue solo corre si la variable de repositorio DEPLOY_PAGES vale "true"
      # (Settings → Secrets and variables → Actions → Variables). GitHub Pages en
      # repositorios privados requiere un plan de pago (Pro/Team).
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
